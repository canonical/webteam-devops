name: Pack and Release

on:
  workflow_call:
    inputs:
      charm_name:
        required: true
        type: string
      channel:
        required: true
        type: string
      environment:
        required: false
        default: ''
        type: string
      force_charm_build:
        required: false
        default: false
        type: boolean
    secrets:
      CHARMHUB_TOKEN:
        required: true
    outputs:
      revision_number:
        value: ${{ jobs.publish-image-and-release-charm.outputs.revision_number }}
      resource_name:
        value: ${{ jobs.publish-image-and-release-charm.outputs.resource_name }}
      resource_revision_number:
        value: ${{ jobs.publish-image-and-release-charm.outputs.resource_revision_number }}

jobs:
  setup:
    name: Check for charm changes
    runs-on: ubuntu-latest
    outputs:
      charm_changed: ${{ steps.check.outputs.charm_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for charm/ changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual runs (workflow_dispatch)
            echo "charm_changed=${{ inputs.force_charm_build }}" >> "$GITHUB_OUTPUT"
          else
            if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q '^charm/'; then
              echo "charm_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "charm_changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  pack-rock:
    name: Pack Rock
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ inputs.environment }}
    env:
      ROCKCRAFT_ENABLE_EXPERIMENTAL_EXTENSIONS: True
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup LXD
        uses: canonical/setup-lxd@main

      - name: Setup rockcraft
        run: sudo snap install rockcraft --classic

      - name: Pack rock
        run: rockcraft pack

      - name: Upload rock
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.charm_name }}-rock
          path: ./*.rock

  pack-and-upload-charm:
    name: Pack and Upload Charm
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.charm_changed == 'true'
    environment: ${{ inputs.environment }}
    env:
      CHARMCRAFT_ENABLE_EXPERIMENTAL_EXTENSIONS: True
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup LXD
        uses: canonical/setup-lxd@main

      - name: Setup charmcraft
        run: sudo snap install charmcraft --classic --channel=latest/stable

      - name: Fetch libs
        run: |
          cd ./charm
          charmcraft fetch-libs

      - name: Pack charm
        run: charmcraft pack -v --project-dir ./charm

      - name: Upload charm
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: charmcraft upload ./*.charm

  publish-image-and-release-charm:
    name: Publish OCI Image and Release Charm
    runs-on: ubuntu-latest
    needs: [pack-rock, pack-and-upload-charm]
    if: always() && !failure()
    environment: ${{ inputs.environment }}
    outputs:
      resource_name: ${{ steps.resource_name.outputs.resource_name }}
      resource_revision_number: ${{ steps.release_charm.outputs.resource_revision_number }}
      image_url: ${{ steps.set_image_url.outputs.image_url }}
      revision_number: ${{ steps.release_charm.outputs.revision_number }}
    steps:
      - name: Get Rock
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.charm_name }}-rock

      - name: Set image URL
        id: set_image_url
        run: echo "image_url=ghcr.io/${GITHUB_REPOSITORY}:$(date +%s)-${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Push to GHCR
        run: skopeo --insecure-policy copy oci-archive:$(ls *.rock) docker://${{ steps.set_image_url.outputs.image_url }} --dest-creds "canonical:${{ secrets.GITHUB_TOKEN }}"

      - name: Pull image and get ID
        id: pull_image
        run: |
          docker pull ${{ steps.set_image_url.outputs.image_url }}
          IMAGE_ID=$(docker images --format "{{.ID}}" ${{ steps.set_image_url.outputs.image_url }})
          echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT
          echo "Pulled image ID: $IMAGE_ID"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Determine resource name
        id: resource_name
        run: |
          if grep -q 'flask-framework' charm/charmcraft.yaml; then
            echo "resource_name=flask-app-image" >> "$GITHUB_OUTPUT"
          elif grep -q 'django-framework' charm/charmcraft.yaml; then
            echo "resource_name=django-app-image" >> "$GITHUB_OUTPUT"
          else
            echo "resource_name=app-image" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup charmcraft
        run: sudo snap install charmcraft --classic --channel=latest/stable

      - name: Upload OCI image resource
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: charmcraft upload-resource ${{ inputs.charm_name }} ${{ steps.resource_name.outputs.resource_name }} --image=${{ steps.pull_image.outputs.image_id }} --verbosity=trace

      - name: Attach resource to charm and release
        id: release_charm
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: |
          revision_number=$(charmcraft revisions "${{ inputs.charm_name }}" | awk 'NR==2 {print $1}')
          echo "revision_number=$revision_number" >> $GITHUB_OUTPUT
          resource_revision_number=$(charmcraft resource-revisions "${{ inputs.charm_name }}" ${{ steps.resource_name.outputs.resource_name }} | awk 'NR==2 {print $1}')
          echo "resource_revision_number=$resource_revision_number" >> $GITHUB_OUTPUT
          charmcraft release "${{ inputs.charm_name }}" --channel=${{ inputs.channel }} --revision $revision_number --resource ${{ steps.resource_name.outputs.resource_name }}:$resource_revision_number
