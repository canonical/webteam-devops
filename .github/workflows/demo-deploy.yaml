name: Reusable demo deploy

on:
  workflow_call:
    inputs:
      pr-number:
        description: Pull request number to deploy
        required: true
        type: number
      commit-sha:
        description: Exact pull request commit SHA to build
        required: true
        type: string
      api-url:
        description: Base URL of the demos controller API
        required: true
        type: string
      api-connect-url:
        description: Optional network endpoint used while preserving the API URL Host header
        required: false
        default: ""
        type: string
      api-insecure:
        description: Disable TLS certificate verification for the connection endpoint
        required: false
        default: false
        type: boolean
      rockcraft-path:
        description: Directory containing rockcraft.yaml
        required: false
        default: .
        type: string
      timeout-seconds:
        description: Maximum time to wait for the demo to become ready
        required: false
        default: 900
        type: number
      poll-interval-seconds:
        description: Delay between controller status requests
        required: false
        default: 10
        type: number
      workflow-client-ref:
        description: webteam-devops ref containing the signed API client
        required: false
        default: main
        type: string
    secrets:
      demos-hmac-key:
        description: Repository-specific HMAC key for the demos controller
        required: true
    outputs:
      demo-url:
        description: URL reported by the demos controller
        value: ${{ jobs.deploy.outputs.demo-url }}
      image-reference:
        description: Immutable GHCR image reference sent to the controller
        value: ${{ jobs.deploy.outputs.image-reference }}

permissions: {}

concurrency:
  group: demo-deploy-${{ github.repository }}-${{ inputs.pr-number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-reference: ${{ steps.image.outputs.reference }}
    steps:
      - name: Check out the exact PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit-sha }}
          persist-credentials: false

      - name: Verify checkout and rock definition
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
          ROCKCRAFT_PATH: ${{ inputs.rockcraft-path }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          test -f "${ROCKCRAFT_PATH}/rockcraft.yaml"

      - name: Validate and pack rock
        id: rockcraft
        uses: canonical/craft-actions/rockcraft/pack@acd2f2e61c7563b38ba89390ca0e910fa7d2784f # v0.1.1
        with:
          path: ${{ inputs.rockcraft-path }}
          verbosity: brief

      - name: Publish immutable PR image to GHCR
        id: image
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr-number }}
          ROCK_FILE: ${{ steps.rockcraft.outputs.rock }}
        run: |
          set -euo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          tag="pr-${PR_NUMBER}-sha-${COMMIT_SHA:0:12}"
          test -n "$ROCK_FILE"
          test -f "$ROCK_FILE"
          rockcraft.skopeo --insecure-policy copy \
            --dest-creds "${GITHUB_ACTOR}:${GH_TOKEN}" \
            "oci-archive:${ROCK_FILE}" "docker://${image_name}:${tag}"
          digest="$(
            rockcraft.skopeo --insecure-policy inspect \
              --creds "${GITHUB_ACTOR}:${GH_TOKEN}" \
              "docker://${image_name}:${tag}" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["Digest"])'
          )"
          test "${digest#sha256:}" != "$digest"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "reference=${image_name}@${digest}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    outputs:
      demo-url: ${{ steps.deploy-api.outputs.demo_url }}
      image-reference: ${{ needs.build.outputs.image-reference }}
    steps:
      - name: Check out signed API client
        uses: actions/checkout@v4
        with:
          repository: canonical/webteam-devops
          ref: ${{ inputs.workflow-client-ref }}
          path: _demo_workflow
          persist-credentials: false

      - name: Request deployment and wait for readiness
        id: deploy-api
        continue-on-error: true
        shell: bash
        env:
          API_CONNECT_URL: ${{ inputs.api-connect-url }}
          API_INSECURE: ${{ inputs.api-insecure }}
          API_URL: ${{ inputs.api-url }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
          DEMOS_HMAC_KEY: ${{ secrets['demos-hmac-key'] }}
          IMAGE_REFERENCE: ${{ needs.build.outputs.image-reference }}
          POLL_INTERVAL: ${{ inputs.poll-interval-seconds }}
          PR_NUMBER: ${{ inputs.pr-number }}
          TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        run: |
          connection_args=()
          if [ -n "$API_CONNECT_URL" ]; then
            connection_args+=(--connect-url "$API_CONNECT_URL")
          fi
          if [ "$API_INSECURE" = "true" ]; then
            connection_args+=(--insecure)
          fi
          python3 _demo_workflow/.github/scripts/demo_api.py \
            --api-url "$API_URL" \
            "${connection_args[@]}" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --timeout "$TIMEOUT_SECONDS" \
            --interval "$POLL_INTERVAL" \
            deploy \
            --commit-sha "$COMMIT_SHA" \
            --image "$IMAGE_REFERENCE" \
            --delivery-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-deploy"

      - name: Update persistent PR comment
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          API_MESSAGE: ${{ steps.deploy-api.outputs.message }}
          API_STATE: ${{ steps.deploy-api.outputs.state }}
          DEMO_URL: ${{ steps.deploy-api.outputs.demo_url }}
          DEPLOY_OUTCOME: ${{ steps.deploy-api.outcome }}
          IMAGE_REFERENCE: ${{ needs.build.outputs.image-reference }}
          MARKER: <!-- demos-controller:${{ github.repository }}:${{ inputs.pr-number }} -->
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = process.env.MARKER;
            const succeeded = process.env.DEPLOY_OUTCOME === "success";
            const state = process.env.API_STATE || (succeeded ? "ready" : "failed");
            const details = process.env.API_MESSAGE ||
              (succeeded ? "The controller reports that the demo is ready." :
                "The workflow failed before the controller reported a final status.");
            const link = process.env.DEMO_URL
              ? `\n\n**Demo:** ${process.env.DEMO_URL}`
              : "";
            const image = process.env.IMAGE_REFERENCE
              ? `\n\n**Image:** \`${process.env.IMAGE_REFERENCE}\``
              : "";
            const body = `${marker}\n## PR demo: ${state}\n\n${details}${link}${image}` +
              `\n\n[Workflow run](${context.serverUrl}/${context.repo.owner}/` +
              `${context.repo.repo}/actions/runs/${context.runId})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: Number("${{ inputs.pr-number }}"),
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: Number("${{ inputs.pr-number }}"),
                body,
              });
            }

      - name: Fail when deployment did not complete
        if: ${{ steps.deploy-api.outcome == 'failure' }}
        shell: bash
        run: exit 1
